<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Diet-Youtube</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Diet-Youtube</h1>
      <p class="ver" id="version"></p>
    </header>
    <label class="switch-row">
      <span id="switch-label">Diet-Youtube: On</span>
      <input type="checkbox" id="enabled" checked />
    </label>
    <p class="hint">
      Off shows native YouTube Home. The switch reloads open YouTube tabs so cloak and Diet chrome apply immediately.
    </p>
    <button type="button" id="reload">Reload YouTube tabs</button>
    <script src="popup.js"></script>
  </body>
</html>
